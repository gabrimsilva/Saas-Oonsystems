<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="-50" cy="-50" r="150" fill="white" opacity="0.15"/>
  <circle cx="1150" cy="100" r="75" fill="white" opacity="0.15"/>
  <circle cx="1100" cy="375" r="100" fill="#ff6ec7" opacity="0.15"/>
  
  <!-- Logo Circle -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="200" r="100" fill="white" opacity="0.95" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  </g>
  
  <!-- Logo Text LIRI -->
  <text x="300" y="220" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="url(#textGradient)" letter-spacing="3">LIRI</text>
  
  <!-- Title -->
  <text x="500" y="140" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="2">LIRI E-Commerce</text>
  
  <!-- Subtitle -->
  <text x="500" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="300" fill="white" opacity="0.95">Térmicas Atacado</text>
  
  <!-- Description line 1 -->
  <text x="500" y="225" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.9">Garrafas térmicas, canetas, acessórios e muito mais.</text>
  
  <!-- Description line 2 -->
  <text x="500" y="250" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.9">Entre em contato pelo WhatsApp e faça seu pedido!</text>
  
  <!-- Icon badges -->
  <g opacity="1">
    <!-- WhatsApp badge -->
    <rect x="500" y="280" width="220" height="44" rx="22" fill="rgba(255,255,255,0.2)"/>
    <text x="610" y="308" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">📱 WhatsApp Direto</text>
    
    <!-- Quality badge -->
    <rect x="740" y="280" width="210" height="44" rx="22" fill="rgba(255,255,255,0.2)"/>
    <text x="845" y="308" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">✨ Qualidade Premium</text>
  </g>
</svg>
