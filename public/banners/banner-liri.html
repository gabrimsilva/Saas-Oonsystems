<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 400px;
            overflow: hidden;
        }
        .banner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Círculos decorativos */
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
        }
        .circle1 {
            width: 300px;
            height: 300px;
            background: white;
            top: -100px;
            left: -100px;
        }
        .circle2 {
            width: 200px;
            height: 200px;
            background: #ff6ec7;
            bottom: -50px;
            right: 100px;
        }
        .circle3 {
            width: 150px;
            height: 150px;
            background: white;
            top: 50px;
            right: -50px;
        }
        
        /* Conteúdo */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }
        
        .logo-section {
            flex: 1;
            text-align: center;
        }
        
        .logo-circle {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.3);
        }
        
        .logo-text {
            font-family: 'Arial Black', sans-serif;
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
        }
        
        .info-section {
            flex: 1;
            color: white;
            padding-left: 60px;
        }
        
        .title {
            font-family: 'Arial', sans-serif;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-family: 'Arial', sans-serif;
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 25px;
            opacity: 0.95;
        }
        
        .description {
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            line-height: 1.6;
            opacity: 0.9;
            max-width: 450px;
        }
        
        .icon-container {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }
        
        .icon-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        
        <div class="content">
            <div class="logo-section">
                <div class="logo-circle">
                    <div class="logo-text">LIRI</div>
                </div>
            </div>
            
            <div class="info-section">
                <div class="title">LIRI E-Commerce</div>
                <div class="subtitle">Térmicas Atacado</div>
                <div class="description">
                    Garrafas térmicas, canetas, acessórios e muito mais.
                    <br>Entre em contato pelo WhatsApp e faça seu pedido!
                </div>
                <div class="icon-container">
                    <div class="icon-item">📱 WhatsApp Direto</div>
                    <div class="icon-item">✨ Qualidade Premium</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
